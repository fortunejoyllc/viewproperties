<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Available Properties | Fortune Joy LLC</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
.section-title{
    font-family:'Playfair Display',serif;
    font-size:2.2rem;
    margin:40px 0 20px;
    color:var(--red);
}
.property-tag.available{
    background:#ffe5e8;
    color:var(--red);
}

.property-tag.unavailable{
    background:var(--red);
    color:#ffe5e8;
}
:root{
    --red:#ff2c2c;
    --dark:#141414;
    --gray:#f7f7f7;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:white;
    color:var(--red);
}
.section{
    margin-bottom:60px;
}

/* ===== NAVBAR ===== */

header{
    position:sticky;
    top:0;
    z-index:999;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(0,0,0,.08);
}

.navbar{
    max-width:1400px;
    margin:auto;
    padding:15px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    display:flex;
    align-items:center;
    gap:15px;
}

.logo img{
    height:65px;
    background:white;
    border-radius:50%;
}

.logo h2{
    font-family:'Playfair Display',serif;
    color:var(--red);
}

.phone{
    background:var(--red);
    color:white;
    padding:12px 20px;
    border-radius:999px;
    font-weight:700;
}

/* ===== HERO ===== */

.hero{
    padding:100px 20px;
    text-align:center;
    background:linear-gradient(rgba(255,44,44,.88), rgba(255,44,44,.88));
    color:white;
}

.hero h1{
    font-family:'Playfair Display',serif;
    font-size:4rem;
    margin-bottom:15px;
}

.hero p{
    font-size:1.1rem;
}

/* ===== PROPERTY GRID ===== */

.properties{
    max-width:1300px;
    margin:auto;
    padding:80px 30px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(380px,1fr));
    gap:40px;
}

.card{
    background:white;
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 15px 40px rgba(0,0,0,.10);
    transition:.35s;
}

.card:hover{
    transform:translateY(-8px);
}

.card img{
    width:100%;
    height:280px;
    object-fit:cover;
    filter:contrast(108%) saturate(108%) brightness(104%);
}

.card-content{
    padding:30px;
}

.card-content h2{
    font-family:'Playfair Display',serif;
    margin-bottom:15px;
}

.property-tag{
    display:inline-block;
    background:#ffe5e8;
    color:var(--red);
    padding:8px 14px;
    border-radius:999px;
    font-size:.85rem;
    font-weight:700;
    margin-bottom:20px;
}

.card-content p{
    color:#666;
    line-height:1.7;
}

.view-btn{
    margin-top:25px;
    display:inline-block;
    background:var(--red);
    color:white;
    padding:14px 24px;
    border-radius:999px;
    text-decoration:none;
    font-weight:700;
}

/* ===== FOOTER ===== */

footer{
    background:#111;
    color:white;
    text-align:center;
    padding:40px 20px;
}

footer img{
    height:70px;
    background:white;
    border-radius:50%;
    padding:5px;
    margin-bottom:15px;
}

@media(max-width:768px){
    .hero h1{
        font-size:2.8rem;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .phone{
        display:none;
    }
}

</style>
</head>

<body>

<header>
    <div class="navbar">
        <div class="logo">
            <img src="logo.png" alt="Fortune Joy">

            <div>
                <h2>Fortune Joy LLC</h2>
                <small>Property Listings</small>
            </div>
        </div>

        <div class="phone">
            850-270-8205
        </div>
    </div>
</header>

<section class="hero">
    <h1>Our Properties</h1>
    <p>Explore properties currently offered by Fortune Joy LLC.</p>
</section>

<section class="properties">

    <div class="section">
        <h2 class="section-title">Available Properties</h2>
        <div class="grid" id="availableGrid"></div>
    </div>

    <div class="section">
        <h2 class="section-title">Unavailable Properties</h2>
        <div class="grid" id="unavailableGrid"></div>
    </div>

</section>

<footer>
    <img src="logo.png" alt="Fortune Joy">

    <h3>Fortune Joy LLC</h3>

    <p>
        2800 S Adams St, Suite #7450<br>
        Tallahassee, FL 32314
    </p>

    <br>

    <p>
        Property Manager: Rajesh Kumar<br>
        850-270-8205
    </p>
</footer>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDfMEwp4pRIGtGzHOJ9n0e1bzAvBsX9jAQ",
  authDomain: "properties-8645d.firebaseapp.com",
  projectId: "properties-8645d",
  storageBucket: "properties-8645d.firebasestorage.app",
  messagingSenderId: "99650468987",
  appId: "1:99650468987:web:b7261a757aea088793b6de",
  measurementId: "G-L9VJ5MGH1G"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function createCard(property) {
  const status = property.status.trim();
    const isAvailable = status === "Available";
    const isUnavailable = status === "Unavailable";

  return `
    <div class="card">
      <img src="${property.image}" alt="${property.title}">

      <div class="card-content">

        <div class="property-tag ${isAvailable ? "available" : "unavailable"}">
          ${property.status}
        </div>

        <h2>${property.title}</h2>

        <p>${property.description}</p>

      </div>
    </div>
  `;
}

async function loadProperties() {
  const snapshot = await getDocs(collection(db, "properties"));

  const availableGrid = document.getElementById("availableGrid");
  const unavailableGrid = document.getElementById("unavailableGrid");

  snapshot.forEach((doc) => {
      const property = doc.data();
      const status = property.status.trim();
    
      if (status === "Available") {
        availableGrid.innerHTML += createCard(property);
      } 
      else if (status === "Unavailable") {
        unavailableGrid.innerHTML += createCard(property);
      }
    });
}

loadProperties();
</script>
    
</body>
</html>
